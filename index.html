<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ほしいもの図鑑</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 10px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #00ffcc; }
        .card-img { width: 100%; height: 180px; background-color: #2a2a2a; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; object-fit: cover; }
        .card-content { padding: 15px; }
        .title { font-size: 18px; font-weight: bold; margin: 0 0 10px 0; color: #fff; }
        .info { font-size: 14px; margin: 5px 0; color: #aaa; }
        .price { color: #ff5555; font-weight: bold; }
        .stars { color: #ffcc00; }

        .get-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: rgba(0, 255, 204, 0.4); font-size: 48px; font-weight: bold; border: 4px solid rgba(0, 255, 204, 0.4); padding: 5px 15px; border-radius: 10px; pointer-events: none; letter-spacing: 2px; z-index: 10; }
        .img-container { position: relative; width: 100%; }
        .card { cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background-color: #1e1e1e; border: 2px solid #333; border-radius: 15px; width: 90%; max-width: 500px; overflow: hidden; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 30px; color: #aaa; cursor: pointer; z-index: 10; }
        .close-btn:hover { color: #fff; }

    </style>
</head>
<body>

    <h1>ほしいもの図鑑</h1>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <button id="sort-cheap" style="height: 38px; padding: 0 16px; line-height: 36px; background: #2a2a2a; color: #fff; border: 1px solid #333; border-radius: 5px; cursor: pointer; margin: 0 5px; font-size: 14px; box-sizing: border-box;">価格の安い順</button>
        <button id="sort-stars" style="height: 38px; padding: 0 16px; line-height: 36px; background: #2a2a2a; color: #fff; border: 1px solid #333; border-radius: 5px; cursor: pointer; margin: 0 5px; font-size: 14px; box-sizing: border-box;">ほしい度が高い順</button>
    </div>

    <div class="grid" id="zukan-grid"></div>
    
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modal-close">&times;</span>
            <div id="modal-body">
            </div>
        </div>
    </div>

    <script>
        let itemData = [];

        function displayItems(items) {
            const grid = document.getElementById('zukan-grid');
            grid.innerHTML = '';
            
            items.forEach((item, index) => {
                const imgContent = item.img ? `<img src="${item.img}" class="card-img" alt="${item.title}">` : `<div class="card-img">NO IMAGE</div>`;
                
                const getOverlay = item.get ? `<div class="get-overlay">GET!</div>` : '';
                
                const cardHTML = `
                    <div class="card" onclick="openModal(${index})">
                        <div class="img-container">
                            ${imgContent}
                            ${getOverlay}
                        </div>
                        <div class="card-content">
                            <div class="title">${item.title}</div>
                            <div class="info">価格: <span class="price">${item.price}</span></div>
                            <div class="info">ほしい度: <span class="stars">${item.stars}</span></div>
                            <div class="info">メモ: ${item.memo}</div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                itemData = data;
                displayItems(itemData);
            })
            .catch(error => {
                console.error('データの読み込みに失敗しました:', error);
                document.getElementById('zukan-grid').innerHTML = '<p style="text-align:center; color:red;">JSONデータの読み込みに失敗しました。</p>';
            });

        function getPriceNumber(priceStr) {
            return Number(priceStr.replace(/[^0-9]/g, ''));
        }

        function getStarCount(starStr) {
            return (starStr.match(/★/g) || []).length;
        }

        document.getElementById('sort-cheap').addEventListener('click', () => {
            const sorted = [...itemData].sort((a, b) => getPriceNumber(a.price) - getPriceNumber(b.price));
            displayItems(sorted);
        });

        document.getElementById('sort-stars').addEventListener('click', () => {
            const sorted = [...itemData].sort((a, b) => getStarCount(b.stars) - getStarCount(a.stars));
            displayItems(sorted);
        });

        function openModal(index) {
            const item = itemData[index];
            const modal = document.getElementById('detail-modal');
            const modalBody = document.getElementById('modal-body');
            
            const imgContent = item.img ? `<img src="${item.img}" style="width:100%; height:auto; max-height:300px; object-fit:cover;" alt="${item.title}">` : `<div class="card-img">NO IMAGE</div>`;
            const getOverlay = item.get ? `<div class="get-overlay" style="font-size:64px;">GET!</div>` : '';

            modalBody.innerHTML = `
                <div class="img-container">
                    ${imgContent}
                    ${getOverlay}
                </div>
                <div style="padding: 20px;">
                    <h2 style="margin-top:0; color:#fff;">${item.title}</h2>
                    <p style="font-size:16px;">価格: <span class="price" style="font-size:18px;">${item.price}</span></p>
                    <p style="font-size:16px;">ほしい度: <span class="stars">${item.stars}</span></p>
                    <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
                    <p style="font-size:15px; color:#ccc; line-height:1.6;"><strong>メモ:</strong><br>${item.memo}</p>
                </div>
            `;
            
            modal.style.display = 'flex';
        }

        const modal = document.getElementById('detail-modal');

        document.getElementById('modal-close').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>

</body>
</html>
