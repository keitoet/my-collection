<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PICKS</title>
    <!-- 💡 スタイルシートとプログラムを並べてすっきり読み込みます -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <!-- 💡 共通ヘッダー（shared.htmlの内容がここに入ります） -->
    <header></header>

    <div id="emergencyAlert" class="emergency-alert"></div>

    <div class="main-container">
        
        <div class="breadcrumb">
            <a href="/my-profile/">HOME</a> ＞ <span>MY PICKS</span>
        </div>

        <!-- 💡 data.json から全自動でカードが並ぶエリア -->
        <div id="collectionGrid" class="collection-grid"></div>
        <div id="paginationArea"></div>

    </div>

    <!-- 💡 【大復活！】PROFILEと同じ白いオシャレな見た目のまま、画面中央に浮かぶ箱 -->
    <div id="detail-modal" class="qr-modal" onclick="closeItemModal()">
        <div class="qr-modal-content" onclick="event.stopPropagation()">
            <!-- 💡 右上の綺麗なグレーのバツボタン -->
            <span class="qr-modal-close" onclick="closeItemModal()">&times;</span>
            
            <!-- ポップアップの中身 -->
            <div id="modalImgBox" class="item-img-box" style="border-radius: 8px; margin-top: 15px; position: relative;"></div>
            <div style="padding-top: 15px; text-align: left;">
                <div id="modalTitle" style="font-size: 18px; font-weight: bold; color: #1a202c; margin-bottom: 12px; line-height: 1.4;"></div>
                <ul id="modalDetails" style="padding: 0; margin: 0 0 15px 0; list-style: none; font-size: 14px; color: #4a5568; font-weight: bold; line-height: 2.0;"></ul>
                
                <!-- 💡 リンクがある時だけ、ここに商品ページへの青いボタンが自動出現します -->
                <div id="modalActionArea" style="display: flex; flex-direction: column; gap: 0;"></div>
            </div>
        </div>
    </div>

    <!-- 💡 共通フッター -->
    <footer></footer>

</body>
</html>
